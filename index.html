<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sat Logo</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .logo {
      width: min(60vw, 60vh);
      height: auto;
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.svg" alt="Sat logo">
</body>
</html>
