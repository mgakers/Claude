<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sat Logo</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
    }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      perspective: 1200px;
    }
    .cube {
      --size: min(45vw, 45vh);
      --half: calc(var(--size) / 2);
      position: relative;
      width: var(--size);
      height: var(--size);
      transform-style: preserve-3d;
      animation: spin 30s linear infinite;
    }
    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      border: 1px solid #333;
      backface-visibility: hidden;
    }
    .face img {
      width: 75%;
      height: auto;
    }
    .front  { transform: translateZ(var(--half)); }
    .back   { transform: rotateY(180deg) translateZ(var(--half)); }
    .right  { transform: rotateY(90deg) translateZ(var(--half)); }
    .left   { transform: rotateY(-90deg) translateZ(var(--half)); }
    .top    { transform: rotateX(90deg) translateZ(var(--half)); }
    .bottom { transform: rotateX(-90deg) translateZ(var(--half)); }

    @keyframes spin {
      from { transform: rotateX(-20deg) rotateY(0deg) rotateZ(0deg); }
      to   { transform: rotateX(340deg) rotateY(720deg) rotateZ(360deg); }
    }

    .keepawake {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .status {
      position: fixed;
      right: 16px;
      bottom: 12px;
      font: 12px/1.4 system-ui, sans-serif;
      color: #666;
      transition: opacity 1s;
    }
    .status.hidden { opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
      .cube { animation-duration: 120s; }
    }
  </style>
</head>
<body>
  <div class="cube" role="img" aria-label="Rotating cube with the Sat logo on each face">
    <div class="face front"><img src="logo.svg" alt=""></div>
    <div class="face back"><img src="logo.svg" alt=""></div>
    <div class="face right"><img src="logo.svg" alt=""></div>
    <div class="face left"><img src="logo.svg" alt=""></div>
    <div class="face top"><img src="logo.svg" alt=""></div>
    <div class="face bottom"><img src="logo.svg" alt=""></div>
  </div>
  <video class="keepawake" muted loop playsinline aria-hidden="true">
    <source src="keepawake.webm" type="video/webm">
    <source src="keepawake.mp4" type="video/mp4">
  </video>
  <div class="status hidden" role="status"></div>

  <script>
    // Keep the screen from sleeping while this page is open.
    // Prefer the Screen Wake Lock API; fall back to a hidden, muted looping video.
    const status = document.querySelector('.status');
    const video = document.querySelector('.keepawake');
    let wakeLock = null;
    let hideTimer;

    function showStatus(text, persist) {
      status.textContent = text;
      status.classList.remove('hidden');
      clearTimeout(hideTimer);
      if (!persist) hideTimer = setTimeout(() => status.classList.add('hidden'), 3000);
    }

    async function keepAwake() {
      if (document.visibilityState !== 'visible') return;
      if ('wakeLock' in navigator) {
        try {
          if (!wakeLock || wakeLock.released) {
            wakeLock = await navigator.wakeLock.request('screen');
            showStatus('Screen will stay awake');
          }
          return;
        } catch (e) {
          // Not allowed here (e.g. no secure context); use the video fallback.
        }
      }
      try {
        await video.play();
        showStatus('Screen will stay awake');
      } catch (e) {
        // Autoplay blocked: start on the first click or key press.
        showStatus('Click anywhere to keep the screen awake', true);
      }
    }

    document.addEventListener('visibilitychange', keepAwake);
    document.addEventListener('click', keepAwake);
    document.addEventListener('keydown', keepAwake);
    keepAwake();
  </script>
</body>
</html>
